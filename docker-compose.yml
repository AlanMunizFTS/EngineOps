name: engineops

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_platform}
      POSTGRES_DB: ${POSTGRES_DB:-ops_platform}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ops_platform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ops_platform_minio}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  api-migrate:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ops_platform:ops_platform@db:5432/ops_platform}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ops_platform:ops_platform@db:5432/ops_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-dev-only-not-for-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db_data:
  minio_data:
