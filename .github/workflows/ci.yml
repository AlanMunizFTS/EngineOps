name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ops_platform
          POSTGRES_PASSWORD: ops_platform
          POSTGRES_DB: ops_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ops_platform:ops_platform@localhost:5432/ops_platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: api
        run: ruff check .

      - name: Format check (black)
        working-directory: api
        run: black --check .

      - name: Run migrations
        working-directory: api
        run: alembic upgrade head

      - name: Run tests
        working-directory: api
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm run test -- --run

      - name: Build
        working-directory: web
        run: npm run build
