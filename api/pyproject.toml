[project]
name = "ops_platform"
version = "0.0.0"
description = "Engineering Ops Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 (last release, unmaintained) breaks against bcrypt>=4.1 (removed
    # `bcrypt.__about__`, which passlib's version probe reads) - pin below that.
    "bcrypt<4.1",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 99
target-version = ["py312"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.mypy]
# Relaxed (not strict) during Phase 0 prototyping per CLAUDE.md §2 — strict mode is planned
# once the auth/domain layer stabilizes past Phase 0.
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
